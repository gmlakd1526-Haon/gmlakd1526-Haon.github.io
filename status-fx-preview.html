<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>버프·디버프 카드 연출 미리보기</title>
<link rel="stylesheet" href="/src/styles/card-status-fx.css?direct">
<style>
 body{margin:0;background:#0d0b09;color:#eadfca;font:14px/1.5 "Malgun Gothic",system-ui,sans-serif;padding:20px}
 h1{font-size:20px;margin:0 0 4px} p{margin:0 0 16px;color:#bfae8e}
 .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:16px}
 .card{display:flex;flex-direction:column;gap:6px}
 .face{position:relative;height:150px;border-radius:6px;overflow:hidden;background:#222 center 20%/cover;border:1px solid #5a4a30}
 .label{display:flex;justify-content:space-between;align-items:center}
 .label b{font-size:15px} .label span{font-size:12px;padding:1px 8px;border-radius:9px}
 .is-b{background:#173a5c;color:#9dd2ff}.is-d{background:#5c1a17;color:#ffb0aa}
 button{background:#2a2117;color:#f0dcae;border:1px solid #7a6236;border-radius:6px;padding:8px 14px;font:inherit;cursor:pointer;margin-bottom:16px}
 .status-icon-art{position:relative;display:inline-block;overflow:hidden}.status-icon-art img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
</style></head><body>
<h1>버프·디버프 카드 연출</h1>
<p>파란 테두리 = 버프, 붉은 테두리 = 디버프. 「다시 걸기」를 누르면 처음 걸릴 때 연출이 다시 나옵니다.</p>
<button id="replay">모두 다시 걸기</button>
<div class="grid" id="grid"></div>
<script>
const S=[['guard','방어',0,'v2'],['barrier','보호막',0,'v2'],['attack-up','공격 강화',0,'v2'],['regen','재생',0,'v2'],['taunt','도발',0,'v1'],['overwatch','경계',0,'v1'],['escort','호위',0,'v1'],
 ['burn','화상',1,'v2'],['poison','중독',1,'v1'],['freeze','빙결',1,'v2'],['shock','감전',1,'v2'],['curse','저주',1,'v2'],['stun','기절',1,'v2'],['silence','침묵',1,'v1'],['mark','약점 표식',1,'v1'],['break','BREAK',1,'v1']];
const pics=['/characters/seolhwa-identity-v2/fullbody.webp'];
const grid=document.getElementById('grid');
function card([id,name,deb,v]){
 const tone=deb?'is-debuff':'is-buff';
 return `<div class="card"><div class="face" style="background-image:url(${pics[0]})"><span class="card-status-fx">
  <i class="csf-loop is-${id} ${tone}"><b></b><em></em></i>
  <i class="csf-burst is-${id} ${tone}" style="--csf-ms:1250ms"><b></b><em></em><u></u></i>
  <span class="csf-chips"><span class="csf-chip ${tone} is-new"><span class="status-icon-art" style="width:20px;height:20px"><img src="/ui/illustrated-status-${v}/${id}.webp"></span><small>8.0</small></span></span>
 </span></div><div class="label"><b>${name}</b><span class="${deb?'is-d':'is-b'}">${deb?'디버프':'버프'}</span></div></div>`;
}
const draw=()=>{grid.innerHTML=S.map(card).join('')};draw();
document.getElementById('replay').onclick=draw;
</script></body></html>
