<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>문장 위치 비교</title>
<style>
@font-face{font-family:'Noto Serif KR';src:url('/fonts/ashen-interface-20261016/NotoSerifKR-variable.woff2') format('woff2');font-weight:200 900}
:root{color-scheme:dark}
body{margin:0;background:#070605;color:#e8dcc6;font:14px/1.5 system-ui,"Malgun Gothic",sans-serif}
h1{font:600 18px "Noto Serif KR",serif;margin:16px 20px 8px;color:#e6c27a}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;padding:0 20px 20px}
@media (max-width:820px){.grid{grid-template-columns:1fr}}
.card{container-type:inline-size;position:relative;aspect-ratio:16/9;overflow:hidden;border:1px solid rgba(230,194,122,.35);border-radius:8px;
  background:linear-gradient(90deg,rgba(6,5,4,.72),rgba(6,5,4,.3) 34%,transparent 54%),url('/ui/title/gate/bg.webp') 66% 30%/cover}
.card>b{position:absolute;right:10px;top:8px;font-size:13px;color:#f3e8d4;background:rgba(0,0,0,.6);padding:2px 9px;border-radius:99px;z-index:5}
.logo{position:absolute;left:6.5%;top:31%;width:38cqw;container-type:inline-size;isolation:isolate;display:grid;grid-template-columns:max-content;justify-content:center;text-align:center}
.logo::before{content:"";position:absolute;z-index:-1;inset:-40% -14%;background:radial-gradient(ellipse 50% 50% at 50% 50%,rgba(42,28,14,.5) 0%,rgba(34,22,10,.3) 45%,transparent 75%)}
.row{display:flex;align-items:center;justify-content:center;gap:1cqw}
.art{display:block;flex:none;height:13cqw;aspect-ratio:2/3;filter:drop-shadow(0 .6cqw 1.2cqw rgba(0,0,0,.75))}
.art img{width:100%;height:100%;object-fit:contain;display:block}
.ko{display:block;white-space:nowrap;font:600 12.6cqw/1.1 "Noto Serif KR",serif;letter-spacing:.12em;
  background:linear-gradient(180deg,#fffdf6 0%,#fbecc6 38%,#e2b56a 56%,#fbe7b8 74%,#d6a65a 100%);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 0 .25cqw rgba(20,12,4,.95)) drop-shadow(0 .25cqw 0 #2a1808) drop-shadow(0 0 1.6cqw rgba(255,190,110,.32)) drop-shadow(0 .8cqw 1.8cqw rgba(0,0,0,.95))}
.en{display:flex;align-items:center;justify-content:center;gap:2cqw;margin-top:.8cqw;white-space:nowrap;font:600 3.4cqw/1 "Noto Serif KR",serif;letter-spacing:.5em;padding-left:.5em;color:#f2dcaa;text-shadow:0 0 .3cqw #000,0 0 1.4cqw #000}
.en i{flex:1 1 0;min-width:4cqw;height:1px;background:linear-gradient(90deg,transparent,#ecca82)}.en i:last-child{background:linear-gradient(90deg,#ecca82,transparent);margin-left:-.5em}
.menu{position:absolute;left:6.5%;bottom:14%;width:38cqw;text-align:center;font:700 2.6cqw "Noto Serif KR",serif;color:#fff1d6;letter-spacing:.2em;opacity:.85}
/* 2 가운데: 「애션」과 「크라운」 사이 띄어쓰기 자리에 */
.mid .ko{display:flex;align-items:center;gap:0}.mid .ko .art{height:13cqw;margin:0 .6cqw;filter:drop-shadow(0 .6cqw 1.2cqw rgba(0,0,0,.75))}
/* 3 위 작게 */
.top .row{flex-direction:column;gap:.6cqw}.top .art{height:16cqw}
/* 4 제목 뒤 크게 은은하게(워터마크) */
.wm .row{position:relative}.wm .art{position:absolute;left:50%;top:50%;height:46cqw;transform:translate(-50%,-52%);opacity:.38;z-index:-1;filter:none}
</style>
</head>
<body>
<h1>왕관·검 문장 자리 비교 — 글자는 지금 그대로</h1>
<div class="grid">
  <div class="card"><b>1 · 지금 (「에」 앞)</b><div class="logo"><span class="row"><span class="art"><img src="/ui/title/crest.png" alt=""></span><span class="ko">애션 크라운</span></span><span class="en"><i></i>ASHEN CROWN<i></i></span></div><div class="menu">화면을 눌러 여정 계속</div></div>
  <div class="card mid"><b>2 · 가운데 (애션 ⚔ 크라운)</b><div class="logo"><span class="row"><span class="ko">애션<span class="art"><img src="/ui/title/crest.png" alt=""></span>크라운</span></span><span class="en"><i></i>ASHEN CROWN<i></i></span></div><div class="menu">화면을 눌러 여정 계속</div></div>
  <div class="card top"><b>3 · 위 작게</b><div class="logo"><span class="row"><span class="art"><img src="/ui/title/crest.png" alt=""></span><span class="ko">애션 크라운</span></span><span class="en"><i></i>ASHEN CROWN<i></i></span></div><div class="menu">화면을 눌러 여정 계속</div></div>
  <div class="card wm"><b>4 · 제목 뒤 크게 은은하게</b><div class="logo"><span class="row"><span class="art"><img src="/ui/title/crest.png" alt=""></span><span class="ko">애션 크라운</span></span><span class="en"><i></i>ASHEN CROWN<i></i></span></div><div class="menu">화면을 눌러 여정 계속</div></div>
</div>
</body>
</html>
