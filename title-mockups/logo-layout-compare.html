<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>로고 배치 비교</title>
<style>
@font-face{font-family:'Noto Serif KR';src:url('/fonts/ashen-interface-20261016/NotoSerifKR-variable.woff2') format('woff2');font-weight:200 900}
:root{color-scheme:dark}
body{margin:0;background:#070605;color:#e8dcc6;font:14px/1.5 system-ui,"Malgun Gothic",sans-serif}
h1{font:600 18px "Noto Serif KR",serif;margin:16px 20px 8px;color:#e6c27a}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;padding:0 20px 20px}
.card{container-type:inline-size;position:relative;aspect-ratio:16/9;overflow:hidden;border:1px solid rgba(230,194,122,.35);border-radius:8px;
  background:linear-gradient(90deg,rgba(6,5,4,.72),rgba(6,5,4,.3) 34%,transparent 54%),url('/ui/title/gate/bg.webp') 66% 30%/cover}
.card>b{position:absolute;right:10px;top:8px;font-size:13px;color:#f3e8d4;background:rgba(0,0,0,.55);padding:2px 8px;border-radius:99px;z-index:3}
.logo{position:absolute;left:6.5%;top:16%;width:38%;container-type:inline-size;text-align:center}
.art{display:block;aspect-ratio:2/3;filter:drop-shadow(0 1cqw 2cqw rgba(0,0,0,.75))}
.art img{width:100%;height:100%;object-fit:contain;display:block}
.ko{display:block;white-space:nowrap;font:600 13.6cqw/1.1 "Noto Serif KR",serif;letter-spacing:.12em;padding-left:.12em;
  background:linear-gradient(180deg,#fffaf0 0%,#f4e2b6 34%,#c99a52 54%,#f3dca4 72%,#b8853f 100%);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 .2cqw 0 #3a2410) drop-shadow(0 0 1.4cqw rgba(255,170,80,.28)) drop-shadow(0 .8cqw 1.6cqw rgba(0,0,0,.9))}
.en{display:flex;align-items:center;justify-content:center;gap:2.6cqw;margin-top:2cqw;font:600 4.9cqw/1 "Noto Serif KR",serif;letter-spacing:.42em;padding-left:.42em;color:#ecca82;text-shadow:0 0 1.4cqw #000}
.en i{width:10cqw;height:1px;background:linear-gradient(90deg,transparent,#ecca82)}.en i:last-child{background:linear-gradient(90deg,#ecca82,transparent);margin-left:-.42em}
/* A: 지금(위) */
.a .art{width:19cqw;margin:0 auto .6cqw}
/* B: 왼쪽, 제목 두 줄 높이 */
.b .logo{display:flex;align-items:center;gap:2cqw;width:44%}
.b .art{width:15cqw;flex:none}
.b .txt{flex:1;min-width:0}.b .ko{font-size:11.6cqw}.b .en{font-size:4.2cqw}
/* C: 왼쪽, 문장을 크게(제목보다 위아래로 넘침) */
.c .logo{display:flex;align-items:center;gap:1.5cqw;width:46%}
.c .art{width:22cqw;flex:none}
.c .txt{flex:1;min-width:0;text-align:left}.c .ko{font-size:11cqw;padding-left:0}.c .en{font-size:4cqw;justify-content:flex-start;padding-left:0}.c .en i:first-child{display:none}
/* D: 양옆 대칭(참고) */
.d .logo{display:flex;align-items:center;gap:1.4cqw;width:46%}
.d .art{width:11cqw;flex:none}.d .art.r{transform:scaleX(-1)}
.d .txt{flex:1;min-width:0}.d .ko{font-size:10.4cqw}.d .en{font-size:3.8cqw}
.menu{position:absolute;left:6.5%;bottom:14%;width:38%;text-align:center;font:700 3cqw "Noto Serif KR",serif;color:#fff1d6;letter-spacing:.2em;opacity:.8}
@media (max-width:820px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<h1>타이틀 로고 배치 비교 — 왕관·검 문장 위치</h1>
<div class="grid">
  <div class="card a"><b>A · 지금 (위)</b><div class="logo"><span class="art"><img src="/ui/title/crest.png" alt=""></span><span class="ko">애션 크라운</span><span class="en"><i></i>ASHEN CROWN<i></i></span></div><div class="menu">화면을 눌러 여정 계속</div></div>
  <div class="card b"><b>B · 왼쪽 (제목 높이)</b><div class="logo"><span class="art"><img src="/ui/title/crest.png" alt=""></span><div class="txt"><span class="ko">애션 크라운</span><span class="en"><i></i>ASHEN CROWN<i></i></span></div></div><div class="menu">화면을 눌러 여정 계속</div></div>
  <div class="card c"><b>C · 왼쪽 (문장 크게 · 글자 왼쪽 정렬)</b><div class="logo"><span class="art"><img src="/ui/title/crest.png" alt=""></span><div class="txt"><span class="ko">애션 크라운</span><span class="en"><i></i>ASHEN CROWN<i></i></span></div></div><div class="menu">화면을 눌러 여정 계속</div></div>
  <div class="card d"><b>D · 양옆 대칭 (참고)</b><div class="logo"><span class="art"><img src="/ui/title/crest.png" alt=""></span><div class="txt"><span class="ko">애션 크라운</span><span class="en"><i></i>ASHEN CROWN<i></i></span></div><span class="art r"><img src="/ui/title/crest.png" alt=""></span></div><div class="menu">화면을 눌러 여정 계속</div></div>
</div>
</body>
</html>
